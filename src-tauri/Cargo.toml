[package]
name = "ferret"
version = "0.1.0"
description = "A beautiful macOS database client"
authors = ["ftfw0621"]
license = "MIT"
repository = "https://github.com/ftfw0621/Ferret"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ferret_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"

# PostgreSQL
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.14"
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Credential storage
keyring = { version = "3", features = ["apple-native"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
thiserror = "2"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"
